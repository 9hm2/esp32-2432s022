; Serial Terminal app a grafikus SD-launcherhez — ESP32-2432S022C
; A lefordult .pio/build/serial-terminal/firmware.bin az APP-IMAGE: ezt másold
; az SD-kártya /apps/ mappájába (pl. /apps/serial.bin), és a launcherbol indítsd.

[platformio]
default_envs = serial-terminal
boards_dir = ../../boards

[env:serial-terminal]
platform = espressif32 @ ^6.9.0
board = esp32-2432S022C
framework = arduino
monitor_speed = 115200

; Közös partíciótábla a launcherrel (ota_0 egyezés).
board_build.partitions = ../../firmware/bootloader/partitions.csv

build_flags =
    -Ofast
    -Wall
    -DLV_CONF_PATH=\"${PROJECT_INCLUDE_DIR}/lv_conf.h\"

lib_deps =
    rzeldent/esp32_smartdisplay @ ^2.1.0
    h2zero/NimBLE-Arduino @ ^1.4.2

upload_speed = 460800
