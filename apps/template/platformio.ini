; Példa-/sablon app a grafikus SD-launcherhez — ESP32-2432S022C
; A lefordult .pio/build/app-template/firmware.bin az APP-IMAGE: ezt kell az
; SD-kártya /apps/ mappájába másolni (lásd README).
;
; FONTOS: ugyanazt a partíciótáblát használja, mint a launcher, hogy az esetleges
; adat-partíciók (nvs) egyezzenek. Az appot a launcher az ota_0-ba flasheli.

[platformio]
default_envs = app-template
boards_dir = ../../boards

[env:app-template]
platform = espressif32 @ ^6.9.0
board = esp32-2432S022C
framework = arduino
monitor_speed = 115200

; Közös partíciótábla a launcherrel.
board_build.partitions = ../../firmware/bootloader/partitions.csv

build_flags =
    -Ofast
    -Wall
    -DLV_CONF_PATH=\"${PROJECT_INCLUDE_DIR}/lv_conf.h\"

lib_deps =
    rzeldent/esp32_smartdisplay @ ^2.1.0

upload_speed = 460800
