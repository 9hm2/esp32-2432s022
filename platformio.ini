; PlatformIO project configuration
; Eszköz: Sunton ESP32-2432S022C (CYD - Cheap Yellow Display, 2.2")
; Grafikus stack: LVGL 9 + esp32-smartdisplay (ST7789 8-bit i80 + CST816S touch)
;
; A board definíció (boards/esp32-2432S022C.json) a projekt mappájában van,
; így a PlatformIO automatikusan felismeri ezt a board-ot - nem kell külön
; submodule. (Forrás: rzeldent/platformio-espressif32-sunton)

[platformio]
default_envs = esp32-2432S022C
boards_dir = boards

[env]
platform = espressif32 @ ^6.9.0
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

build_flags =
    -Ofast
    -Wall
    ; LVGL a saját lv_conf.h-nkból olvas (include/ mappa).
    ; A path STRING literálként kell az #include LV_CONF_PATH-hoz -> escapelt idézőjelek.
    -DLV_CONF_PATH=\"${PROJECT_INCLUDE_DIR}/lv_conf.h\"
    ; A kijelző natívan álló (portrait), de a libben rotálható futásidőben

lib_deps =
    rzeldent/esp32_smartdisplay @ ^2.1.0

[env:esp32-2432S022C]
board = esp32-2432S022C

; Soros (USB-UART) feltöltés. A CYD CH340-et használ, így alapból OK.
upload_speed = 460800
