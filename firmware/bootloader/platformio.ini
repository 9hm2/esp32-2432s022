; Grafikus SD-kártyás bootloader / app-indító — ESP32-2432S022C
; M1: partíciótábla + SD mount + .bin listázás a soros porton.
;
; A board-definíció a repó gyökerében lévő boards/ mappából jön (boards_dir).

[platformio]
default_envs = bootloader
boards_dir = ../../boards

[env:bootloader]
platform = espressif32 @ ^6.9.0
board = esp32-2432S022C
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; Saját partíciótábla (factory launcher + ota_0 app)
board_build.partitions = partitions.csv

build_flags =
    -Wall

upload_speed = 460800
